<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background: transparent;
            position: relative;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        .element {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 8px;
        }
        .element img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        .element.text-box {
            word-break: break-word;
            padding: 10px 20px;
            font-weight: bold;
        }
        /* Стили для встраиваемых виджетов / iframe */
        .element iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
            pointer-events: none; /* Чтобы клики пролетали сквозь чат в OBS */
        }
    </style>
</head>
<body>
    <div id="canvas"></div>

    <script>
        const canvas = document.getElementById('canvas');
        const wsProtocol = location.protocol === 'https:' ? 'wss:' : 'ws:'; 
        const ws = new WebSocket(`${wsProtocol}//${location.host}`);

        ws.onmessage = (event) => {
            try {
                const msg = JSON.parse(event.data);
                if (msg.type === 'SYNC') {
                    render(msg.elements);
                }
            } catch (e) {
                console.error(e);
            }
        };

        function render(elements) {
            canvas.innerHTML = '';
            elements.forEach(el => {
                const div = document.createElement('div');
                div.className = 'element';
                if (el.type === 'text') div.className += ' text-box';
                
                div.style.left = el.x + 'px';
                div.style.top = el.y + 'px';
                div.style.width = el.width + 'px';
                div.style.height = el.height + 'px';
                div.style.opacity = el.opacity ?? 1;

                if (el.type === 'text') {
                    div.textContent = el.content;
                    div.style.fontSize = el.fontSize + 'px';
                    div.style.color = el.color;
                    div.style.backgroundColor = el.bgColor;
                } else if (el.type === 'image') {
                    const img = document.createElement('img');
                    img.src = el.content;
                    div.appendChild(img);
                } else if (el.type === 'iframe') {
                    const iframe = document.createElement('iframe');
                    iframe.src = el.content;
                    div.appendChild(iframe);
                }

                canvas.appendChild(div);
            });
        }
    </script>
</body>
</html>
